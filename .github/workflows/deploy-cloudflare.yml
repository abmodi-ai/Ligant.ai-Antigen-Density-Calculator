# Deploys the built site to Cloudflare Pages by direct upload.
#
# This path is used instead of GitHub Pages, which is unavailable for private
# repositories on the Free plan, and instead of Cloudflare's dashboard Git
# integration, which cannot be configured through the API. Everything here runs
# from CI once two repository secrets exist:
#
#   CLOUDFLARE_API_TOKEN   token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard URL or account home
#
# Add them under Settings -> Secrets and variables -> Actions.

name: Deploy to Cloudflare Pages

# The default branch of this repository is Main. Actions matches these patterns
# case-sensitively, so watching "main" watched nothing: three pushes to Main,
# including the merge of #2, ran CI and deployed nothing, and the site served
# the last build from the working branch for as long as that went unnoticed. A
# deploy that silently does not happen is worse than one that fails, so this
# names the branch as the repository spells it.
on:
  push:
    branches: [Main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

env:
  PROJECT_NAME: ligant-tools

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Secrets reach the shell through env, never interpolated into the script
      # itself: a token containing shell metacharacters would otherwise break
      # the test, and the value never appears in the command line.
      - name: Check credentials are present
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not set; skipping deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Prove it before shipping it.
      #
      # This step used to be `npm run build` alone, which is `tsc -b && vite
      # build`. So a change that broke every test in the suite but still
      # compiled would deploy to production, and CI would go red about it
      # afterwards, next to a live site already serving the change. Nothing
      # here read CI's result, and nothing waited for it.
      #
      # `npm run verify` is the same suite CI runs: style, privacy, typecheck,
      # tests, build, and a full session in a real browser. It also produces
      # the dist/ this job uploads, so it replaces the build rather than adding
      # to it. Ungated by the credentials check above, because whether the
      # change is sound is worth knowing even on a run that cannot deploy.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify

      # `pages deploy` will not create a missing project in a non-interactive
      # shell, so create it on first run and leave it alone afterwards.
      - name: Ensure the Pages project exists
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx wrangler@3 pages project list | grep -qw "$PROJECT_NAME"; then
            echo "Project $PROJECT_NAME already exists."
          else
            npx wrangler@3 pages project create "$PROJECT_NAME" \
              --production-branch "${{ github.event.repository.default_branch }}"
          fi

      # Cloudflare decides production against the project's own production
      # branch, and this project was created from the working branch the suite
      # was built on, so its production branch is not what this repository
      # calls its default. Deploying under `github.ref_name` would therefore
      # have published Main as a preview: a green deploy, a URL nobody visits,
      # and benchtools.ligant.ai unchanged. The branch is read from the project
      # instead, so a release lands on production whatever the project calls it.
      - name: Resolve the project's production branch
        id: target
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -o pipefail
          # A dispatch from a branch that is not the default one is a preview of
          # that branch, deliberately: releasing is merging, not dispatching.
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Not the default branch; deploying $REF_NAME as a preview." >> "$GITHUB_STEP_SUMMARY"
            echo "branch=$REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          production="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success){console.error(JSON.stringify(j.errors));process.exit(1)}if(!j.result.production_branch){console.error("project reports no production branch");process.exit(1)}process.stdout.write(j.result.production_branch)})')"
          echo "Deploying to production (project branch: $production)." >> "$GITHUB_STEP_SUMMARY"
          echo "branch=$production" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@3 pages deploy dist \
            --project-name "$PROJECT_NAME" \
            --branch "${{ steps.target.outputs.branch }}" \
            --commit-dirty=true

      # The privacy claim is about what the browser does on the deployed site,
      # and until now nothing tested that. npm run check:network drives the same
      # application from a local server reading dist/ off disk, so it cannot see
      # anything the edge injects after the build, nor whether the headers in
      # public/_headers reach the browser at all. A scientific review found a
      # Cloudflare Web Analytics beacon in a capture of the live site that no
      # check here could have caught.
      #
      # Production only. A preview deployment answers on a per-deployment
      # hostname that this does not resolve, and the claim being defended is
      # about the origin readers actually visit.
      - name: Verify the deployed site
        if: steps.creds.outputs.ready == 'true' && steps.target.outputs.branch == github.event.repository.default_branch
        run: |
          npx playwright install --with-deps chromium
          # Pages serves the new deployment within seconds, but not always by
          # the time wrangler returns. Three attempts, then it is a real failure.
          #
          # Only a failed assertion is retried. Exit 2 means the check could not
          # run at all, which no amount of waiting fixes: it crashed on every
          # deploy for eleven days while the site was fine, and the loop
          # reported it three times over as a failed deployment.
          for attempt in 1 2 3; do
            set +e
            node scripts/check-deployed.mjs
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$status" -ne 1 ]; then
              echo "The deployed-site check could not run (exit $status). The deployment itself is not implicated; scripts/check-deployed.mjs is." >> "$GITHUB_STEP_SUMMARY"
              exit "$status"
            fi
            echo "Attempt $attempt failed; retrying in 15s."
            sleep 15
          done
          echo "The deployed site did not pass verification." >> "$GITHUB_STEP_SUMMARY"
          exit 1
