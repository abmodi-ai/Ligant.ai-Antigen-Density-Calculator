name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Prose conventions, then privacy static analysis. Both are cheap and
      # both fail fast, so a violation is reported before the slower steps run.
      - run: npm run check:style
      - run: npm run check:privacy

      - run: npx tsc -b
      - run: npm test
      - run: npm run build

      # The runtime proof that nothing leaves the origin. It needs a real
      # browser, so it runs after the build and installs chromium first.
      - run: npx playwright install --with-deps chromium
      - run: npm run check:network

      - run: npm run build:single
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            dist
            dist-single
