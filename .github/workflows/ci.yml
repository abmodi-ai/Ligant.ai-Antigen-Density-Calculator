name: CI

# Pull requests only.
#
# This watched every branch once, then Main and every pull request, and both
# arrangements ran the suite twice for one push. Main is now covered by the
# deploy workflow, which runs this same suite before it ships anything, so a
# push to Main that also ran this would be doing the work twice over again.
#
# What is left is the moment the work is offered for review. Push a branch with
# no pull request and nothing runs until you open one, or dispatch it by hand.
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Prose conventions, then privacy static analysis. Both are cheap and
      # both fail fast, so a violation is reported before the slower steps run.
      - run: npm run check:style
      - run: npm run check:privacy

      - run: npx tsc -b
      - run: npm test
      - run: npm run build

      # The runtime proof that nothing leaves the origin. It needs a real
      # browser, so it runs after the build and installs chromium first.
      - run: npx playwright install --with-deps chromium
      - run: npm run check:network

      - run: npm run build:single
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            dist
            dist-single
